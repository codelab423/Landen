# Runs the smoke test on a clean checkout for every push and pull request, so missing
# files (e.g. ignored by .gitignore) show up before anything is merged.
name: Smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
