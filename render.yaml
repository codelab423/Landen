# Render Blueprint — free web service. The data lives in a free Neon Postgres
# database (DATABASE_URL), because Render's free disk is wiped on every restart.
services:
  - type: web
    name: landen
    runtime: node
    plan: free
    # npm test = smoke test (scripts/smoke-test.js) on a throwaway database: if it fails,
    # the build fails and the current version stays live.
    buildCommand: npm ci && npm test
    startCommand: npm start
    # Render only switches to a new version once /healthz answers 200 (server + database ok).
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FAMILY_CODE
        sync: false
